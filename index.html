  <style amp-custom>
    :root {
      --bg-dark: #030712;
      --neon-cyan: #fffb00;
      --neon-blue: #fffb00;
      --neon-magenta: #ffe600;
      --text-main: #c4d8e2;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }

    body {
  font-family: 'Chakra Petch', sans-serif;
  color: var(--text-main);
  background-color: var(--bg-dark);
  
  /* Background Gambar Lu + Efek Gelap + Grid Cyberpunk */
  background-image: 
    linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
    linear-gradient(rgba(3, 7, 18, 0.85), rgba(3, 7, 18, 0.9)), /* Efek gelap */
    url('images/banner-oxibet88.webp'); /* Ganti pakai link gambar lu */
    
  background-size: 20px 20px, 20px 20px, cover, cover;
  background-attachment: fixed; /* Biar gambar diam pas di-scroll */
  background-position: center;
  
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px 10px;
}

    a { text-decoration: none; color: inherit; }

    .shell {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 2;
    }

    /* HEADER & LOGO */
    .header {
      background: rgba(3, 7, 18, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-bottom: 2px solid var(--neon-cyan);
      border-radius: 8px 8px 24px 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 243, 255, 0.1);
    }
    .logo { filter: drop-shadow(0 0 8px rgba(255, 217, 0, 0.521)); }

    /* TERMINAL MARQUEE */
    .marquee-wrapper {
      background: #000;
      border-left: 4px solid var(--neon-cyan);
      border-right: 4px solid var(--neon-cyan);
      border-radius: 4px;
      padding: 8px 10px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
      position: relative;
    }
    .marquee-wrapper::before {
      content: "oxibet88";
      position: absolute;
      left: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--neon-magenta);
      font-weight: 700;
      font-size: 12px;
      z-index: 2;
      background: #000;
      padding-right: 10px;
    }
    .marquee-text {
      display: inline-block;
      white-space: nowrap;
      color: var(--neon-cyan);
      font-size: 13px;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
      padding-left: 100%;
      animation: marquee 15s linear infinite;
    }
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

    /* HUD PANEL CARD */
    .hud-panel {
      background: rgba(5, 9, 20, 0.95);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-top: 3px solid var(--neon-cyan);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0, 243, 255, 0.05);
    }
    .hud-panel::after {
      content: ""; position: absolute; top: 10px; right: 10px;
      width: 10px; height: 10px; border-radius: 50%;
      background: #39ff14; box-shadow: 0 0 10px #39ff14;
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* HERO IMAGE */
    .hero-img {
      border-radius: 8px;
      border: 1px solid rgba(0, 243, 255, 0.4);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
      margin-bottom: 20px;
      display: block;
    }

    /* CYBER BUTTONS */
    .cta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }
    .btn-cyber {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 6px;
      transition: 0.2s all;
      position: relative;
      overflow: hidden;
    }
    .btn-cyber:active { transform: scale(0.95); }

    .btn-login {
      background: transparent;
      color: var(--neon-cyan);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1);
    }
    .btn-daftar {
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-cyan));
      color: #000;
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
      text-shadow: 0 1px 2px rgba(255,255,255,0.5);
    }

    /* MODULE BADGES */
    .module-title {
      color: var(--text-main); font-family: 'Orbitron', sans-serif;
      font-size: 12px; letter-spacing: 2px; margin-bottom: 10px;
      border-bottom: 1px dashed rgba(0, 243, 255, 0.3); padding-bottom: 5px;
    }
    .badge-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px;
    }
    .badge {
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.2);
      color: var(--neon-cyan);
      padding: 8px 5px;
      font-size: 11px;
      text-align: center;
      font-weight: 600;
      border-radius: 4px;
      text-transform: uppercase;
    }
    
    /* LIVECHAT SPECIAL BADGE */
    .badge-livechat {
      background: linear-gradient(90deg, rgba(255, 230, 0, 0.1), rgba(255, 230, 0, 0.3));
      border: 1px solid var(--neon-magenta);
      color: #fff;
      display: block; width: 100%; text-align: center; padding: 12px;
      border-radius: 4px; font-weight: 700; letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(255, 208, 0, 0.3);
      font-family: 'Orbitron', sans-serif; font-size: 12px;
    }

    /* FOOTER */
    .footer {

      letter-spacing: 1px;
      text-transform: uppercase;
    }
